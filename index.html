<title>IU Klausur-Drill</title>

<style>html,body{margin:0;padding:0} body{font:14px -apple-system,BlinkMacSystemFont,sans-serif} img{max-width:100%} [hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: ein Karteikasten. Links Kurswahl und Fächerstand, Mitte die aktuelle Karte, alles einspaltig auf dem Handy. */
:root{
  --bg:#EEF0F4; --surface:#FFFFFF; --sunk:#E3E6EE; --line:#CDD2DE;
  --fg:#18203A; --muted:#5B6480; --accent:#2B50D6; --accent-ink:#FFFFFF; --accent-soft:#DCE3FB;
  --good:#1F7A4D; --good-soft:#D7F0E2; --bad:#B3322B; --bad-soft:#F7DDDA; --warn:#9A6400; --warn-soft:#F6EACB;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131C; --surface:#181C28; --sunk:#0B0E15; --line:#2C3346;
  --fg:#E6E9F2; --muted:#949CB5; --accent:#7D98FF; --accent-ink:#0B1030; --accent-soft:#232C4E;
  --good:#5FD39A; --good-soft:#15352A; --bad:#FF8A80; --bad-soft:#3E1E1D; --warn:#F2C062; --warn-soft:#3A2E14;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131C; --surface:#181C28; --sunk:#0B0E15; --line:#2C3346;
  --fg:#E6E9F2; --muted:#949CB5; --accent:#7D98FF; --accent-ink:#0B1030; --accent-soft:#232C4E;
  --good:#5FD39A; --good-soft:#15352A; --bad:#FF8A80; --bad-soft:#3E1E1D; --warn:#F2C062; --warn-soft:#3A2E14;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:18px 60px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font:500 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Kopf */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:22px;font-weight:800}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:500;font-size:14px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* Home */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;padding-block:8px 20px;border-bottom:1px solid var(--line)}
.hero h2{font-size:clamp(26px,5vw,38px);font-weight:800;line-height:1.08}
.hero .meta{color:var(--muted);margin-top:6px}
.countdown{text-align:right}
.countdown .big{font:800 40px/1 var(--display)}
.countdown label{display:block;margin-top:6px;color:var(--muted);font-size:13px}
.countdown input{font:inherit;font-size:13px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
@media (max-width:560px){.hero{grid-template-columns:1fr}.countdown{text-align:left}}

.start{margin-block:22px;display:grid;grid-template-columns:1fr;gap:12px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r);padding:16px 20px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px}
.primary strong{font:800 20px/1.2 var(--display)}
.primary span{opacity:.85;font-size:14px}
.primary .kbd{font-family:var(--mono);font-size:12px;opacity:.8}
.opts{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px;align-items:center}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.opts select{font:inherit;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px 6px}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:28px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.mode:hover{border-color:var(--accent)}
.mode b{font-weight:600}
.mode small{color:var(--muted);font-size:13px;line-height:1.4}
.mode .count{font-family:var(--mono);font-size:12px;color:var(--accent)}

.stand h3{font-size:18px;margin-bottom:4px}
.stand p{color:var(--muted);margin:0 0 14px;font-size:14px;max-width:62ch}
.tierrow{display:grid;grid-template-columns:110px 1fr 70px;gap:12px;align-items:center;padding-block:6px}
.bar{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--good)} .bar .b{background:var(--warn)} .bar .w{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
table.lessons{width:100%;border-collapse:collapse;margin-top:18px;font-size:14px}
table.lessons td,table.lessons th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
table.lessons th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
table.lessons td.l{font-family:var(--mono);color:var(--muted);width:40px}
table.lessons td.p{width:130px}
.tbl{overflow-x:auto}
.pill{display:inline-block;font:500 11px/1 var(--mono);padding:4px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.A{background:var(--accent-soft);color:var(--accent)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 12px;color:var(--muted);font-size:13px}
.ghost:hover{color:var(--fg);border-color:var(--fg)}
.foot{margin-top:28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;align-items:center}

/* Session */
.sesshead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sesshead .track{flex:1;height:6px;background:var(--sunk);border-radius:999px;overflow:hidden}
.sesshead .track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(20,30,60,.35)}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.card .q{font:600 19px/1.4 var(--body);margin:0 0 18px;white-space:pre-line}
.card .q strong{color:var(--bad);text-transform:uppercase;letter-spacing:.02em}
.choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:11px 12px;line-height:1.4}
.choice:hover:not([disabled]){border-color:var(--accent)}
.choice .k{font:500 12px/22px var(--mono);text-align:center;border:1px solid var(--line);border-radius:6px;height:24px;color:var(--muted)}
.choice[disabled]{cursor:default}
.choice.ok{background:var(--good-soft);border-color:var(--good)}
.choice.ok .k{background:var(--good);color:var(--surface);border-color:var(--good)}
.choice.no{background:var(--bad-soft);border-color:var(--bad)}
.choice.no .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.choice.picked{border-color:var(--accent);background:var(--accent-soft)}
.explain{margin-top:14px;padding:12px 14px;border-radius:var(--r);background:var(--sunk);font-size:14px}
.explain b{display:block;margin-bottom:2px}
.explain.good b{color:var(--good)} .explain.bad b{color:var(--bad)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:10px 18px;font-weight:600}
.btn.sec{background:var(--sunk);color:var(--fg)}
.btn.good{background:var(--good);color:var(--surface)} .btn.bad{background:var(--bad);color:var(--surface)}
.hint{color:var(--muted);font-size:12px;font-family:var(--mono);margin-right:auto}
textarea{width:100%;min-height:130px;font:inherit;font-size:15px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);padding:12px;resize:vertical}
.recall-note{color:var(--muted);font-size:14px;margin:-8px 0 12px}
.items{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:6px;counter-reset:it}
.items li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:9px 10px;cursor:pointer;background:var(--bg);counter-increment:it;user-select:none}
.items li::before{content:counter(it);font:500 12px var(--mono);color:var(--muted);text-align:center}
.items li .pts{font:500 12px var(--mono);color:var(--muted)}
.items li.on{background:var(--good-soft);border-color:var(--good)}
.items li.on .pts{color:var(--good)}
.items li .txt{min-width:0}
.tally{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:14px;color:var(--muted);gap:12px;flex-wrap:wrap}
.tally b{color:var(--fg);font-family:var(--mono)}
.tip{margin-top:10px;font-size:13px;color:var(--muted)}

/* Ergebnis */
.result{text-align:left}
.result .score{font:800 56px/1 var(--display);margin:6px 0}
.verdict{display:inline-block;padding:5px 10px;border-radius:999px;font-weight:600;font-size:14px}
.verdict.pass{background:var(--good-soft);color:var(--good)} .verdict.fail{background:var(--bad-soft);color:var(--bad)}
.review{margin-top:18px;display:grid;gap:8px}
.review .r{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:14px;background:var(--bg)}
.review .r.bad{border-color:var(--bad)}
.review .r .a{color:var(--muted);margin-top:4px}
.examtimer{font-family:var(--mono);color:var(--muted);font-size:13px}
.examtimer.low{color:var(--bad);font-weight:600}
.examhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.taktik{margin:10px 0 0;padding-left:20px;display:grid;gap:3px;font-size:14px;max-width:70ch}
.nenn{font:500 12px var(--mono);color:var(--muted);margin-top:6px}
.nenn.ok{color:var(--good)}
.warnbox{margin-top:12px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);font-size:14px}
.statusrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:6px;border-bottom:1px solid var(--line)}
.statusrow b{min-width:110px}
.statusrow .ghost[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.empty{padding:26px;text-align:center;color:var(--muted)}
@media (max-width:560px){.card{padding:16px}.card .q{font-size:17px}.tierrow{grid-template-columns:80px 1fr 56px}}
.ready{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface);margin-top:20px}
.ready.go{border-color:var(--good)}
.ready .rhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ready h3{font-size:17px}
.ready ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.ready li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:14px}
.ready .chk{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--surface)}
.ready li.ok .chk{background:var(--good);border-color:var(--good)}
.ready li .num{color:var(--muted);font-size:13px}
table.plan td{vertical-align:top}
table.plan .muted{color:var(--muted);font-size:13px}
table.plan tr.exam td{background:var(--accent-soft)}
table.plan tr.buffer td,table.plan tr.off td{color:var(--muted)}
table.plan tr.today td{box-shadow:inset 0 2px 0 var(--accent), inset 0 -2px 0 var(--accent)}
table.plan tr.past{opacity:.55}
@media (max-width:560px){table.plan thead{display:none}table.plan tr{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;padding:10px 6px;border-bottom:1px solid var(--line);align-items:center}table.plan td{border:0;padding:0}table.plan td:nth-child(3){grid-column:1/-1;order:4}table.plan td:nth-child(2){justify-self:start}}
.rh{font-size:18px;margin:26px 0 10px}
.readgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;font-size:14px}
.rcard ol,.rcard ul{margin:6px 0 0;padding-left:20px;display:grid;gap:2px}
.facts{display:grid;gap:0;border-top:1px solid var(--line)}
.fact{padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.fact .fq{color:var(--muted)}
.fact .fa{margin-top:2px}
.fact .fx{margin-top:3px;font-size:13px;color:var(--muted)}
ol.kern{margin:0;padding-left:22px;display:grid;gap:8px;max-width:70ch;font-size:15px}
.callout{margin:14px 0 0;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--fg);font-size:14px}
.callout.good{background:var(--good-soft)}
ol.steps{list-style:none;padding:0;margin:0 0 8px;display:grid;gap:8px}
ol.steps li{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
ol.steps li.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
ol.steps li.done{opacity:.6}
ol.steps .sn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font:500 12px var(--mono)}
ol.steps li.done .sn{background:var(--good);color:var(--surface)}
ol.steps li.cur .sn{background:var(--accent);color:var(--accent-ink)}
ol.steps .sb{min-width:0;display:flex;flex-direction:column}
ol.steps .sb span{color:var(--muted);font-size:13px}
ol.steps .sm{color:var(--muted);font-size:12px;white-space:nowrap}
@media (max-width:560px){ol.steps li{grid-template-columns:30px 1fr auto}ol.steps .sm{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:var(--bg,#EEF0F4)}
#lock form{background:var(--surface,#fff);border:1px solid var(--line,#CDD2DE);border-radius:14px;padding:24px;max-width:360px;width:100%;box-sizing:border-box}
#lock h1{font-family:var(--display,sans-serif);font-size:24px;margin:0 0 6px;color:var(--fg,#18203A)}
#lock p{margin:0 0 16px;color:var(--muted,#5B6480);font-family:var(--body,sans-serif)}
#lock input{width:100%;box-sizing:border-box;font:16px var(--mono,monospace);padding:12px;border:1px solid var(--line,#CDD2DE);border-radius:10px;margin-bottom:12px;background:#fff;color:#18203A}
#lock button{width:100%;font:600 15px var(--body,sans-serif);padding:12px;border:0;border-radius:10px;background:var(--accent,#2B50D6);color:#fff;cursor:pointer}
#lock .err{color:var(--bad,#B3322B);min-height:20px;margin:10px 0 0}
</style>
</head><body>
<div id="lock"><form id="lf" autocomplete="on">
<h1>Klausur-Drill</h1>
<p>Passwort eingeben. Es bleibt auf diesem Gerät gespeichert.</p>
<input id="pw" type="password" autocomplete="current-password" placeholder="xxxx-xxxx-xxxx-xxxx" required>
<button type="submit">Öffnen</button>
<p class="err" id="err"></p>
</form></div>
<div class="wrap" id="app"></div>

const PKEY = "iu-drill-pass";
const ub = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pass){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:ub(ENC.salt), iterations:310000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:ub(ENC.iv)}, key, ub(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function start(pass, pl){
  async function rpc(fn, body){
    const r = await fetch(SB_URL + "/rest/v1/rpc/" + fn, {method:"POST", headers:{"apikey":SB_KEY, "Authorization":"Bearer " + SB_KEY, "Content-Type":"application/json"}, body:JSON.stringify(body)});
    if(!r.ok) throw new Error("sync " + r.status);
    const t = await r.text(); return t ? JSON.parse(t) : null;
  }
  let docsP = null;
  const load = () => docsP || (docsP = rpc("drill_get_docs", {p_pass:pass}).then(d => d || {}).catch(e => { docsP = null; throw e; }));
  const col = { doc(k){ return {
    async get(){ const d = await load(); let v = d[k]; if(v == null && pl.seed[k]) v = pl.seed[k]; return {exists: v != null, data: () => v}; },
    async set(obj){ await rpc("drill_set_doc", {p_pass:pass, p_doc:k, p_data:obj}); }
  }; } };
  window.claude = { use: async n => n === "db" ? {collection: () => col} : n === "user" ? {id: async () => "me"} : null };
  document.getElementById("lock").remove();
  const s = document.createElement("script"); s.textContent = pl.code; document.body.appendChild(s);

  let lastPull = Date.now();
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState !== "visible" || Date.now() - lastPull < 20000) return;
    lastPull = Date.now(); docsP = null;
    try{ if(typeof initCloud === "function") initCloud(); }catch(e){}
  });
}
async function tryPass(pass, quiet){
  try{ const pl = await decrypt(pass); try{ localStorage.setItem(PKEY, pass); }catch(e){} start(pass, pl); return true; }
  catch(e){ if(!quiet) document.getElementById("err").textContent = "Passwort stimmt nicht."; return false; }
}
document.getElementById("lf").addEventListener("submit", e => { e.preventDefault(); tryPass(document.getElementById("pw").value.trim().toLowerCase()); });
let saved = null; try{ saved = localStorage.getItem(PKEY); }catch(e){}
if(saved) tryPass(saved, true);
